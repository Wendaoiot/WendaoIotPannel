## EMQX 覆盖配置（容器内挂载为 /opt/emqx/etc/emqx.conf）
## 仅补充 8883 SSL listener；其余沿用镜像默认。
## 证书由 gen-certs.sh / gen-certs.ps1 生成，挂载于 /opt/emqx/certs（只读）。

node {
  name = "emqx@127.0.0.1"
  cookie = "wqemqxcookie_local"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  listeners {
    http.bind = 18083
  }
}

listeners.ssl.default {
  enabled = true
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/certs/ca.crt"
    certfile   = "/opt/emqx/certs/server.crt"
    keyfile    = "/opt/emqx/certs/server.key"
    verify     = verify_none
  }
}
