# WendaoIotPannel Nginx 站点模板
# 由 scripts/50_frontend.sh 渲染（替换 __DOMAIN__/__PORT__/__ADMIN_ROOT__/__H5_ROOT__）后
# 安装到 /etc/nginx/conf.d/wendao.conf。

server {
    listen 80;
    server_name __DOMAIN__;

    # 如需 443：拿到证书后取消注释（建议用 certbot，或把 20_certs 产物拷入）
    # listen 443 ssl;
    # ssl_certificate     __CERT_DIR__/server.crt;
    # ssl_certificate_key __CERT_DIR__/server.key;

    # 管理后台
    location / {
        root __ADMIN_ROOT__;
        try_files $uri $uri/ /index.html;
    }

    # C 端 H5
    location /iot/ {
        alias __H5_ROOT__/;
        try_files $uri $uri/ /iot/index.html;
    }

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
